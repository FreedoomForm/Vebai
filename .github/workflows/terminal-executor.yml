name: terminal-executor

# Headless Linux executor for the site's `terminal` tool (Kaggle-free per
# owner rule). Command text / output / produced files NEVER appear in these
# public logs: they travel only between the site API and /tmp files.
#
# RESIDENT mode (owner request 2026-10-18): one run stays alive ~5h40m
# (under the 6h GitHub job cap), continuously draining the command queue
# and idling between commands. When the shift ends or the runner dies, the
# site's tick (/api/agent/tick) sees the stale session heartbeat and
# dispatches a fresh run - the executor reconnects itself, 24/7.
# One-time setup (owner): repo secrets GH_TERM_SECRET + VEBAI_SITE_URL.

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'TerminalSession id (kind=gh)'
        required: true
      cmd:
        description: 'TerminalCommand id to claim (optional)'
        required: false
        default: ''
      timeout:
        description: 'per-command timeout, minutes (<=30)'
        required: false
        default: '15'

concurrency:
  group: gh-term-${{ github.event.inputs.session }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # resident shift backstop (< 6h GitHub job cap)
    steps:
      - name: Checkout (executor script lives in the repo)
        uses: actions/checkout@v4

      - name: Preinstall common agent libraries (once per shift)
        run: |
          pip install -q --disable-pip-version-check \
            reportlab matplotlib python-docx openpyxl python-pptx \
            pillow pandas beautifulsoup4 lxml qrcode pypdf requests \
            || true
          python3 -c "import reportlab, matplotlib, docx, openpyxl, pptx, pypdf; print('agent libs OK')" || true
          # T33: the Telegram app on the agent's computer (.github/tg.js)
          npm install --no-save --no-audit --no-fund telegram \
            || echo "tg.js will self-install on first use"

      - name: Execute queued terminal commands
        env:
          SITE: ${{ secrets.VEBAI_SITE_URL }}
          SECRET: ${{ secrets.GH_TERM_SECRET }}
          SESSION: ${{ github.event.inputs.session }}
          CMDID: ${{ github.event.inputs.cmd }}
          TMO: ${{ github.event.inputs.timeout }}
          # agent mode ('#!agent' tasks): GLM brain + budget knobs
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
          # T24: AGENT_MAX_STEPS '0' = no step cap (Z.ai-style: the only bounds
          # are the task budget below and the shift deadline). Budget 45->90 min
          # for long document jobs; per-shift queue still protected.
          AGENT_MAX_STEPS: '0'
          AGENT_BUDGET_MIN: '90'
        run: python3 .github/terminal_executor.py

  # T26: personal telegram agents - parallel resident job. Every 30 s it asks
  # /api/tg/work which user accounts are connected + switched on, keeps one
  # GramJS MTProto client per account and answers incoming private messages
  # from the user's own account per their approved rules.
  tguser:
    name: personal telegram agents (userbot listener)
    runs-on: ubuntu-latest
    timeout-minutes: 350 # resident shift backstop (< 6h GitHub job cap)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GramJS (worker dependency)
        run: npm install --no-save --no-audit --no-fund telegram

      - name: Run userbot supervisor
        env:
          SITE: ${{ secrets.VEBAI_SITE_URL }}
          SECRET: ${{ secrets.GH_TERM_SECRET }}
        run: node .github/tg_userbot.js

  # T30: self-perpetuating resident chain. GitHub Actions cron throttles
  # low-activity repos (heartbeat.yml */5 actually fired twice in 8 hours),
  # so the shift queues its own successor: the concurrency group keeps at
  # most one running + one pending run, and the pending one starts the moment
  # this shift ends - zero-gap 24/7 for the terminal executor AND the
  # personal telegram agents. GITHUB_TOKEN can trigger workflow_dispatch
  # (documented exception to the no-recursive-runs rule). Kill switch: the
  # site's /api/tg/work responds {"resident":false} -> chain stops.
  chain:
    name: queue the next resident shift
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: dispatch successor unless the site says stop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE: ${{ secrets.VEBAI_SITE_URL }}
          SECRET: ${{ secrets.GH_TERM_SECRET }}
        run: |
          R=$(curl -s -m 30 -X POST -H 'content-type: application/json' \
              -d "{\"secret\":\"$SECRET\"}" "$SITE/api/tg/work" || echo '{}')
          echo "site says: $(printf '%s' "$R" | head -c 160)"
          if printf '%s' "$R" | grep -q '"resident":false'; then
            echo "site asked to stop the resident chain - not dispatching"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/terminal-executor.yml/dispatches" \
            -f ref=main \
            -f "inputs[session]=${{ github.event.inputs.session }}" \
            -f "inputs[timeout]=${{ github.event.inputs.timeout }}" \
            && echo "successor shift queued"
