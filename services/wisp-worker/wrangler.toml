name = "vebai-wisp"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Deploy (needs a free Cloudflare account + `npx wrangler login`):
#   cd services/wisp-worker && npx wrangler deploy
# Then set in Vercel:
#   NEXT_PUBLIC_WISP_URL=wss://vebai-wisp.<account>.workers.dev/

# Optional shared-secret gate (recommended for production):
# [vars]
# WISP_SECRET = ""
